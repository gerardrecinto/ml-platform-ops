[project]
name = "mlplat"
version = "0.1.0"
description = "Scoring service, model promotion gate and SLO alerts for an ML platform."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
