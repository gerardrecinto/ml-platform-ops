apiVersion: v1
kind: Namespace
metadata: {name: mlplat}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: registry, namespace: mlplat}
data:
  registry.json: |
    {"active":"v2","previous":"v1","models":{
      "v1":{"bias":-3.0,"threshold":0.5,"weights":{"amount_k":0.9,"country_mismatch":1.2,"new_device":0.8,"velocity_1h":0.3}},
      "v2":{"bias":-3.2,"threshold":0.5,"weights":{"amount_k":0.8,"country_mismatch":1.6,"new_device":1.1,"velocity_1h":0.5}}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlplat, namespace: mlplat}
spec:
  replicas: 2
  progressDeadlineSeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: mlplat}}
  template:
    metadata: {labels: {app: mlplat}}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: mlplat}}}
      containers:
        - name: mlplat
          image: mlplat:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: REGISTRY, value: /etc/mlplat/registry.json}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 3, failureThreshold: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10, failureThreshold: 3}
          lifecycle: {preStop: {exec: {command: ["sleep", "5"]}}}
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: registry, mountPath: /etc/mlplat, readOnly: true}]
      volumes: [{name: registry, configMap: {name: registry}}]
---
apiVersion: v1
kind: Service
metadata: {name: mlplat, namespace: mlplat}
spec:
  selector: {app: mlplat}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: mlplat, namespace: mlplat}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: mlplat}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: mlplat, namespace: mlplat}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: mlplat}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
